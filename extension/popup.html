<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
    }
    .authentic {
      background-color: #d4edda;
      color: #155724;
    }
    .suspicious {
      background-color: #fff3cd;
      color: #856404;
    }
    .deepfake {
      background-color: #f8d7da;
      color: #721c24;
    }
    .insufficient_data {
      background-color: #e2e3e5;
      color: #383d41;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .loading {
      text-align: center;
      color: gray;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h3>AntiDeepfake VK Analyzer</h3>
  <button id="checkBtn">Проверить видео</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
